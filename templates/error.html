{% extends 'base.html' %}
{% from 'partials/icons.html' import icon %}
{% block title %}{{ title }}{% endblock %}

{% block body %}
<main class="error-page" id="main">
  <div class="stack" style="align-items:center;gap:var(--sp-4)">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt=""
         width="72" height="72" style="border-radius:50%">
    <p class="error-page__code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn--primary" href="{{ url_for('index') }}">
      {{ icon('arrow-right', 'icon--sm') }} Back to sign in
    </a>
  </div>
</main>
{% endblock %}
